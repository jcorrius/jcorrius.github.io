version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'jcorrius'
    assignees:
      - 'jcorrius'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    groups:
      # vitest and its UI must be upgraded together (peer deps)
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/ui'
      # eslint plugin and parser must be the same version
      typescript-eslint:
        patterns:
          - '@typescript-eslint/eslint-plugin'
          - '@typescript-eslint/parser'
      # jsdom and its types should stay in sync
      jsdom:
        patterns:
          - 'jsdom'
          - '@types/jsdom'
      # eslint ecosystem
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'globals'
